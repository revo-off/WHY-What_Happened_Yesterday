apiVersion: 1
datasources:
  - name: Prometheus
    type: prometheus
    url: http://prometheus:9090
    access: proxy
    isDefault: true
  - name: Postgres
    type: postgres
    url: postgres:5432
    user: ${POSTGRES_USER}
    access: proxy
    jsonData:
      database: ${POSTGRES_DB}
      sslmode: disable
    secureJsonData:
      password: ${POSTGRES_PASSWORD}
