name: CI

# PR vers main  : lint + tests + build des images (sans push)
# push sur main : idem + push dans ghcr.io avec le tag <horodatage UTC>-<sha court> (et latest)
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.8.4
      - run: ruff check --output-format=github services

  test:
    name: Tests (ingest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ingest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/ingest/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -v

  build:
    name: Build & push (${{ matrix.service }})
    needs: [lint, test] # lint ou test rouge => aucune image construite ni publiée
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [api, ingest]
    env:
      PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image name and tag
        id: meta
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"   # ghcr exige des minuscules
          image="ghcr.io/${owner}/why-${{ matrix.service }}"
          tag="$(date -u +%Y%m%d-%H%M%S)-${GITHUB_SHA::7}"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}"     >> "$GITHUB_OUTPUT"
          echo "Image : ${image}:${tag}"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and push on main)
        uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          push: ${{ env.PUSH == 'true' }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Summary
        if: env.PUSH == 'true'
        run: |
          echo "Publié : \`${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"

  # Point d'entrée unique pour la protection de branche : exiger le check « CI OK ».
  ci-ok:
    name: CI OK
    if: always()
    needs: [test, build]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any job failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
      - run: echo "Toutes les étapes sont vertes."
